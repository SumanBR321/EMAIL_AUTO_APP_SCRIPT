<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><?= pageTitle ?></title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #E2653B;
      --color-primary-hover: #D4542B;
      --color-primary-subtle: #F0C0B8;
      --color-bg: #F8F8F7;
      --color-surface: #FFFFFF;
      --color-border: #E4E4E4;
      --color-text-main: #181818;
      --color-text-secondary: #878687;
      --color-dark: #282828;
      --radius-card: 24px;
      --radius-pill: 9999px;
      --shadow-soft: 0 4px 20px -2px rgba(24, 24, 24, 0.05), 0 2px 6px -1px rgba(24, 24, 24, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: var(--color-surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-soft);
      padding: 40px 36px;
      text-align: center;
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-pill);
      background-color: #FDF1ED;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: var(--color-primary);
    }

    .icon-wrapper.success {
      background-color: #EAF7EE;
      color: #2E7D32;
    }

    .icon-wrapper.error {
      background-color: #FDE8E8;
      color: #C62828;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--color-text-main);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 15px;
      line-height: 1.55;
      color: var(--color-text-secondary);
      margin-bottom: 24px;
    }

    .email-badge {
      display: inline-block;
      background: #F2F2F1;
      color: var(--color-text-main);
      font-weight: 500;
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      margin-bottom: 28px;
      border: 1px solid var(--color-border);
      word-break: break-all;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 28px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .agency-footer {
      margin-top: 32px;
      font-size: 12px;
      color: #9C9B9C;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <? if (view === "confirm") { ?>
        <div class="icon-wrapper">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <h1>Confirm Unsubscribe</h1>
        <p>You are requesting to unsubscribe from future vendor outreach emails from <strong><?= agencyName ?></strong>.</p>
        <div class="email-badge"><?= recipientEmail ?></div>
        
        <form method="POST" action="<?= formActionUrl ?>">
          <input type="hidden" name="action" value="unsub_confirm">
          <input type="hidden" name="token" value="<?= token ?>">
          <button type="submit" class="btn btn-primary">Confirm Unsubscribe</button>
        </form>

      <? } else if (view === "success") { ?>
        <div class="icon-wrapper success">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h1>Unsubscribed</h1>
        <p>Your email address has been permanently removed from our outreach list.</p>
        <div class="email-badge"><?= recipientEmail ?></div>
        <p style="font-size: 13px; color: #878687;">You will not receive any further automated outreach messages from our team.</p>

      <? } else { ?>
        <div class="icon-wrapper error">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <h1>Invalid or Expired Link</h1>
        <p><?= errorMessage || "This unsubscribe link is invalid or has expired. If you still wish to be removed, please reply directly with STOP to any of our emails." ?></p>
      <? } ?>

      <div class="agency-footer">
        <strong><?= agencyName ?></strong><br>
        <?= agencyPostalAddress ?>
      </div>
    </div>
  </div>
</body>
</html>
